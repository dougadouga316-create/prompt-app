<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI画像プロンプト一覧</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6255e0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="プロンプト">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --bg:#f5f6fa; --surface:#fff; --surface2:#f0f1f6; --border:#dde0ea;
  --accent:#6255e0; --accent2:#7c6af7; --glow:rgba(98,85,224,0.09);
  --text:#1a1c2a; --muted:#6b7280; --dim:#9ca3af;
  --green:#10b981; --red:#ef4444; --amber:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

/* ── HEADER ── */
header{
  padding:10px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  background:var(--surface);z-index:200;flex-shrink:0;
}
.logo{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--accent2);letter-spacing:.1em;text-transform:uppercase;background:var(--glow);padding:3px 8px;border-radius:4px;border:1px solid rgba(124,106,247,.25);}
header h1{font-size:14px;font-weight:600;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.sync-status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);}
.sync-dot.ok{background:var(--green);} .sync-dot.err{background:var(--red);} .sync-dot.loading{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.copy-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}
.copy-count span{color:var(--accent);font-weight:700;}
.hdr-btn{padding:5px 11px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:'Noto Sans JP',sans-serif;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.hdr-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--glow);}

/* ── LAYOUT ── */
.app{display:flex;flex:1;min-height:0;}

/* ── SIDEBAR ── */
.sidebar{width:195px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-head{padding:9px 8px 5px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sidebar-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
#catList{flex:1;overflow-y:auto;padding:6px 5px;}

/* 大カテゴリ */
.big-cat{margin-bottom:3px;}
.big-cat-btn{
  display:flex;align-items:center;width:100%;padding:7px 9px;
  border-radius:6px;border:none;background:none;
  color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .12s;text-align:left;gap:5px;
}
.big-cat-btn:hover{background:var(--surface2);}
.big-cat-btn.open{background:var(--glow);color:var(--accent);}
.big-cat-btn .arrow{font-size:10px;margin-left:auto;transition:transform .15s;color:var(--muted);}
.big-cat-btn.open .arrow{transform:rotate(90deg);color:var(--accent);}
.big-cat-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0;}

/* 中カテゴリ */
.mid-cats{display:none;padding-left:10px;}
.big-cat.open .mid-cats{display:block;}
.mid-cat-btn{
  display:flex;align-items:center;width:100%;padding:6px 9px;
  border-radius:5px;border:none;background:none;
  color:var(--dim);font-family:'Noto Sans JP',sans-serif;font-size:12px;
  cursor:pointer;transition:all .12s;text-align:left;gap:5px;margin-bottom:1px;
}
.mid-cat-btn:hover{background:var(--surface2);color:var(--text);}
.mid-cat-btn.active{background:var(--glow);color:var(--accent);font-weight:600;border-left:2px solid var(--accent);padding-left:7px;}
.mid-cat-btn .count{margin-left:auto;font-size:10px;background:var(--surface2);padding:1px 5px;border-radius:10px;color:var(--muted);flex-shrink:0;}
.mid-cat-btn.active .count{background:var(--glow);color:var(--accent);}

.sidebar-foot{padding:7px 7px 10px;border-top:1px solid var(--border);flex-shrink:0;}
.add-cat-btn{width:100%;padding:7px 10px;border-radius:6px;border:1px dashed var(--border);background:none;color:var(--muted);font-family:'Noto Sans JP',sans-serif;font-size:11px;cursor:pointer;transition:all .15s;text-align:left;}
.add-cat-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--glow);}

/* ── CENTER ── */
.center{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.center-top{padding:10px 16px 8px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px 13px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:13px;outline:none;transition:border-color .2s;margin-bottom:7px;}
.search-input:focus{border-color:var(--accent);}
.search-input::placeholder{color:var(--muted);}
.cat-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cat-header h2{font-size:14px;font-weight:600;}
.cat-header .sub{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.cat-actions{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;}
.sm-btn{padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:11px;cursor:pointer;transition:all .12s;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;}
.sm-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--glow);}
.sm-btn.danger:hover{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.06);}
.sm-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.sm-btn.primary:hover{background:var(--accent2);}

/* ① プロンプト全表示：overflow-y:auto, flex:1 で確実に全表示 */
.prompt-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 72px;}
.prompt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:7px;}

/* ── CARD ── */
.prompt-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:9px;padding:10px 12px;cursor:pointer;
  transition:all .13s;position:relative;overflow:hidden;user-select:none;
}
.prompt-card:hover{border-color:rgba(98,85,224,.4);box-shadow:0 2px 8px rgba(98,85,224,.08);transform:translateY(-1px);}
.prompt-card:active{transform:translateY(0);}
.prompt-card.in-builder{border-color:var(--accent);background:var(--glow);}
.prompt-card.flash{border-color:var(--green)!important;background:rgba(16,185,129,.06)!important;}
.card-actions{position:absolute;top:6px;right:6px;display:flex;gap:3px;opacity:0;transition:opacity .13s;z-index:2;}
.prompt-card:hover .card-actions{opacity:1;}
.card-btn{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 5px;font-size:10px;color:var(--muted);cursor:pointer;transition:all .12s;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.card-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--glow);}
.card-btn.add-btn:hover{color:var(--green);border-color:var(--green);background:rgba(16,185,129,.07);}
.card-btn.edit-btn:hover{color:var(--amber);border-color:var(--amber);}
.card-btn.del-btn:hover{color:var(--red);border-color:var(--red);background:rgba(239,68,68,.06);}
.prompt-ja{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;line-height:1.4;}
.prompt-en{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);word-break:break-all;padding-right:4px;line-height:1.4;}

/* ── BUILDER ── */
.builder{width:280px;flex-shrink:0;border-left:1px solid var(--border);background:#f8f9fd;display:flex;flex-direction:column;overflow:hidden;}
.builder-head{padding:11px 13px 9px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;background:var(--surface);flex-shrink:0;}
.builder-head h3{font-size:12px;font-weight:600;}
.builder-cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-left:auto;}
.builder-cnt span{color:var(--accent);font-weight:700;}
.builder-out-wrap{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);}
.builder-out-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.builder-out{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);line-height:1.6;min-height:50px;word-break:break-all;}
.builder-out.empty{color:var(--muted);font-style:italic;font-family:'Noto Sans JP',sans-serif;font-size:11px;}
.builder-actions{display:flex;gap:5px;margin-top:6px;}
.action-btn{flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-family:'Noto Sans JP',sans-serif;font-size:11px;cursor:pointer;transition:all .15s;font-weight:500;}
.action-btn.copy-all{background:var(--accent);color:#fff;border-color:var(--accent);}
.action-btn.copy-all:hover{background:var(--accent2);}
.action-btn.clear-all{background:var(--surface2);color:var(--muted);}
.action-btn.clear-all:hover{background:rgba(239,68,68,.08);color:var(--red);border-color:var(--red);}
.builder-tags{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 12px;}
.builder-tag{display:flex;align-items:flex-start;gap:6px;padding:7px 0;border-bottom:1px solid var(--border);animation:slideIn .15s ease;}
@keyframes slideIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.builder-tag-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);min-width:15px;padding-top:2px;flex-shrink:0;}
.builder-tag-text{flex:1;min-width:0;}
.builder-tag-en{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);word-break:break-all;}
.builder-tag-ja{font-size:11px;color:var(--muted);margin-top:1px;}
.tag-rm{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:1px 3px;border-radius:3px;transition:all .12s;flex-shrink:0;}
.tag-rm:hover{color:var(--red);background:rgba(239,68,68,.08);}
.builder-empty{text-align:center;padding:24px 14px;color:var(--muted);font-size:11px;line-height:1.9;}
.builder-sep{display:flex;align-items:center;gap:8px;padding:5px 0;margin:2px 0;}
.builder-sep-line{flex:1;height:1px;background:var(--accent);opacity:.25;}
.builder-sep-label{font-size:10px;color:var(--accent);font-family:'Noto Sans JP',sans-serif;white-space:nowrap;background:var(--glow);padding:1px 8px;border-radius:10px;border:1px solid rgba(98,85,224,.2);}
.builder-sep-rm{background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;padding:1px 3px;border-radius:3px;transition:all .12s;flex-shrink:0;}
.builder-sep-rm:hover{color:var(--red);background:rgba(239,68,68,.08);}
.insert-sep-btn{width:100%;padding:5px 8px;border-radius:5px;border:1px dashed rgba(98,85,224,.35);background:none;color:var(--accent);font-family:'Noto Sans JP',sans-serif;font-size:11px;cursor:pointer;transition:all .15s;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:5px;}
.insert-sep-btn:hover{background:var(--glow);border-color:var(--accent);}
.builder-out-group{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);word-break:break-all;line-height:1.7;}
.builder-out-group-sep{display:block;height:6px;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.15);width:460px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;animation:slideUp .18s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal.wide{width:560px;}
.modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;}
.modal-head h3{font-size:14px;font-weight:600;}
.modal-close{margin-left:auto;background:none;border:none;font-size:19px;color:var(--muted);cursor:pointer;border-radius:5px;padding:2px 6px;transition:all .12s;}
.modal-close:hover{background:var(--surface2);color:var(--text);}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:7px;justify-content:flex-end;}
.form-group{margin-bottom:13px;}
.form-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;display:block;}
.form-input,.form-select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:13px;outline:none;transition:border-color .2s;}
.form-input:focus,.form-select:focus{border-color:var(--accent);}
.form-hint{font-size:11px;color:var(--muted);margin-top:3px;}
.sync-info{background:var(--surface2);border-radius:8px;padding:11px 13px;font-size:12px;line-height:1.8;color:var(--muted);margin-bottom:13px;}
.sync-info strong{color:var(--text);}

/* ── TOAST ── */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1c2a;border:1px solid #2a2d3a;color:#e2e4f0;font-family:'JetBrains Mono',monospace;font-size:11px;padding:8px 16px;border-radius:8px;opacity:0;transition:all .2s;pointer-events:none;z-index:999;max-width:480px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty-msg{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

/* ── MOBILE ── */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:150;height:56px;align-items:stretch;}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;color:var(--muted);font-family:'Noto Sans JP',sans-serif;font-size:10px;cursor:pointer;transition:color .15s;padding:5px 0;}
.mob-nav-btn .icon{font-size:19px;line-height:1;}
.mob-nav-btn.active{color:var(--accent);}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

@media(max-width:700px){
  header{padding:9px 12px;}
  header h1{font-size:12px;}
  .logo,.copy-count,.sync-status{display:none;}
  .hdr-btn{padding:5px 8px;font-size:11px;}
  .app{height:calc(100vh - 43px - 56px);}
  .sidebar{display:none;width:100%;border-right:none;}
  .center{display:none;width:100%;}
  .builder{display:none;width:100%;border-left:none;}
  .sidebar.mob-active,.center.mob-active,.builder.mob-active{display:flex;}
  .mob-nav{display:flex;}
  .modal,.modal.wide{width:95vw;}
  /* ① スマホでも全表示 */
  .prompt-grid{grid-template-columns:1fr;}
  .prompt-card{padding:12px 13px;}
  .prompt-ja{font-size:14px;}
  .prompt-en{font-size:12px;}
  .card-actions{opacity:1;top:9px;right:7px;}
  .cat-actions{margin-left:0;width:100%;}
  .big-cat-btn{font-size:13px;padding:9px 10px;}
  .mid-cat-btn{font-size:13px;padding:8px 10px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">PROMPT</div>
  <h1>AI画像プロンプト一覧</h1>
  <div class="hdr-right">
    <div class="sync-status"><div class="sync-dot" id="syncDot"></div><span id="syncLabel">未設定</span></div>
    <div class="copy-count">コピー: <span id="copyCount">0</span></div>
    <button class="hdr-btn" onclick="openSync()">☁ DB設定</button>
    <button class="hdr-btn" onclick="openManage()">⚙ 管理</button>
  </div>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebarEl">
    <div class="sidebar-head"><span class="sidebar-title">カテゴリ</span></div>
    <div id="catList"></div>
    <div class="sidebar-foot">
      <button class="add-cat-btn" onclick="openAddCat()">＋ カテゴリを追加</button>
    </div>
  </aside>

  <!-- CENTER -->
  <div class="center" id="centerEl">
    <div class="center-top">
      <input class="search-input" type="text" id="searchInput" placeholder="🔍 英語・日本語で検索...">
      <div class="cat-header">
        <h2 id="catTitle">カテゴリを選択</h2>
        <span class="sub" id="catSub"></span>
        <div class="cat-actions" id="catActions" style="display:none">
          <button class="sm-btn" onclick="openRenameCat()">✏ 名前変更</button>
          <button class="sm-btn primary" onclick="openAddPrompt()">＋ 追加</button>
          <button class="sm-btn danger" onclick="deleteCat()">🗑 削除</button>
        </div>
      </div>
    </div>
    <!-- ① スクロール領域を確実にflex:1+overflow-y:auto -->
    <div class="prompt-list" id="promptList">
      <div class="prompt-grid" id="grid"></div>
    </div>
  </div>

  <!-- BUILDER -->
  <div class="builder" id="builderEl">
    <div class="builder-head">
      <h3>📝 プロンプトビルダー</h3>
      <div class="builder-cnt"><span id="builderCount">0</span> 件</div>
    </div>
    <div class="builder-out-wrap">
      <div class="builder-out-label">生成されるプロンプト</div>
      <div class="builder-out empty" id="builderOut">「＋追加」で積み上げていく...</div>
      <div class="builder-actions">
        <button class="action-btn copy-all" onclick="copyAll()">📋 全コピー</button>
        <button class="action-btn clear-all" onclick="clearAll()">🗑 クリア</button>
      </div>
      <button class="insert-sep-btn" id="insertSepBtn" style="display:none" onclick="insertSeparator()">↵ ここに改行を挿入</button>
    </div>
    <div class="builder-tags" id="builderTags">
      <div class="builder-empty">「＋追加」でプロンプトが<br>ここに積み上がります<br><br>カードをクリックで単体コピー</div>
    </div>
  </div>
</div>

<nav class="mob-nav" id="mobNav">
  <button class="mob-nav-btn active" id="mnCat" onclick="mobSwitch('cat')"><span class="icon">☰</span><span>カテゴリ</span></button>
  <button class="mob-nav-btn" id="mnPrompt" onclick="mobSwitch('prompt')"><span class="icon">📋</span><span>プロンプト</span></button>
  <button class="mob-nav-btn" id="mnBuilder" onclick="mobSwitch('builder')"><span class="icon">📝</span><span>ビルダー</span></button>
</nav>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
// ══════════════════════════════════════
//  MOBILE（先に定義）
// ══════════════════════════════════════
function mobSwitch(p){
  if(window.innerWidth>700)return;
  ['cat','prompt','builder'].forEach(k=>{
    document.getElementById(k==='cat'?'sidebarEl':k==='prompt'?'centerEl':'builderEl').classList.toggle('mob-active',p===k);
    document.getElementById('mn'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('active',p===k);
  });
}
function initMobile(){if(window.innerWidth<=700)document.getElementById('sidebarEl').classList.add('mob-active');}

// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
const LS_DATA='promptData_v3', LS_ORDER='promptOrder_v3', LS_SYNC='promptSync_v3';
let data={};        // {大カテゴリ: {中カテゴリ: [{en,ja}]}}
let bigOrder=[];    // 大カテゴリの順序
let midOrder={};    // {大カテゴリ: [中カテゴリの順序]}
let currentBig=null, currentMid=null;
let copyCount=0, builderItems=[], toastTimer=null;
let syncUrl=localStorage.getItem(LS_SYNC)||'';

// 大カテゴリアイコン
const BIG_ICONS={'キャラベース':'👤','構図':'📐','表情':'😊','身体':'💪','顔':'👁','エロ':'🔞'};

function loadLocal(){
  try{
    const s=localStorage.getItem(LS_DATA);
    data=s?JSON.parse(s):{};
    const ord=localStorage.getItem(LS_ORDER);
    const saved=ord?JSON.parse(ord):{big:[],mid:{}};
    bigOrder=saved.big||[];
    midOrder=saved.mid||{};
    // 新しいキーを補完
    Object.keys(data).forEach(b=>{if(!bigOrder.includes(b))bigOrder.push(b);if(!midOrder[b])midOrder[b]=[];Object.keys(data[b]).forEach(m=>{if(!midOrder[b].includes(m))midOrder[b].push(m);});});
    bigOrder=bigOrder.filter(b=>data[b]);
    Object.keys(midOrder).forEach(b=>{if(data[b])midOrder[b]=midOrder[b].filter(m=>data[b][m]);});
  }catch(e){data={};bigOrder=[];midOrder={};}
}
function saveLocal(){
  localStorage.setItem(LS_DATA,JSON.stringify(data));
  localStorage.setItem(LS_ORDER,JSON.stringify({big:bigOrder,mid:midOrder}));
}

// ══════════════════════════════════════
//  GITHUB SYNC
// ══════════════════════════════════════
function setSyncStatus(state,label){
  document.getElementById('syncDot').className='sync-dot'+(state?' '+state:'');
  document.getElementById('syncLabel').textContent=label;
}
async function fetchFromGitHub(){
  if(!syncUrl)return;
  setSyncStatus('loading','同期中...');
  try{
    const r=await fetch(syncUrl+'?_='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const remote=await r.json();
    data=remote;
    // 順序を再構築
    const newBig=bigOrder.filter(b=>data[b]);
    Object.keys(data).forEach(b=>{if(!newBig.includes(b))newBig.push(b);});
    bigOrder=newBig;
    Object.keys(data).forEach(b=>{
      if(!midOrder[b])midOrder[b]=[];
      const newMid=midOrder[b].filter(m=>data[b][m]);
      Object.keys(data[b]).forEach(m=>{if(!newMid.includes(m))newMid.push(m);});
      midOrder[b]=newMid;
    });
    saveLocal();
    setSyncStatus('ok','同期済み');
    renderSidebar();
    if(currentBig&&currentMid&&data[currentBig]&&data[currentBig][currentMid])renderGrid(data[currentBig][currentMid],currentMid);
    showToast('☁ GitHubから最新データを取得しました');
  }catch(e){setSyncStatus('err','取得失敗');showToast('⚠ GitHub取得失敗: '+e.message);}
}

function openSync(){
  showModal({title:'☁ GitHub JSON DB設定',body:`
    <div class="sync-info"><strong>仕組み：</strong><br>GitHubの prompts.json を読み込み先に設定します。<br>JSONを更新するとアプリ起動時に自動反映されます。<br><br><strong>URL形式：</strong><br><code>https://raw.githubusercontent.com/ユーザー名/リポジトリ名/main/prompts.json</code></div>
    <div class="form-group"><label class="form-label">GitHub Raw URL</label><input class="form-input" id="f_url" value="${escH(syncUrl)}" placeholder="https://raw.githubusercontent.com/..."><div class="form-hint">GitHubのRaw URLを貼り付け</div></div>
    <div style="display:flex;gap:7px;margin-top:4px">
      <button class="sm-btn" style="flex:1" onclick="testSync()">🔍 テスト接続</button>
      <button class="sm-btn danger" onclick="document.getElementById('f_url').value=''">解除</button>
    </div>
    <div id="syncTestRes" style="margin-top:9px;font-size:12px;color:var(--muted)"></div>
  `,confirmLabel:'保存して同期',confirmClass:'primary',onConfirm:()=>{
    syncUrl=document.getElementById('f_url').value.trim();
    localStorage.setItem(LS_SYNC,syncUrl);
    if(syncUrl)fetchFromGitHub();else setSyncStatus('','未設定');
  }});
  setTimeout(()=>document.getElementById('f_url').focus(),50);
}
window.testSync=async function(){
  const url=document.getElementById('f_url').value.trim();
  const el=document.getElementById('syncTestRes');
  if(!url){el.textContent='⚠ URLを入力してください';return;}
  el.textContent='🔄 確認中...';
  try{
    const r=await fetch(url+'?_='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const cats=Object.keys(j).length;
    el.style.color='var(--green)';el.textContent=`✅ 接続成功！ ${cats}大カテゴリを確認`;
  }catch(e){el.style.color='var(--red)';el.textContent='❌ 失敗: '+e.message;}
};

// ══════════════════════════════════════
//  ② SIDEBAR：大カテゴリ＋中カテゴリ
// ══════════════════════════════════════
function renderSidebar(){
  const list=document.getElementById('catList');
  list.innerHTML='';
  bigOrder.forEach(big=>{
    if(!data[big])return;
    const div=document.createElement('div');
    div.className='big-cat'+(big===currentBig?' open':'');

    const btn=document.createElement('button');
    btn.className='big-cat-btn'+(big===currentBig?' open':'');
    btn.innerHTML=`<span class="big-cat-icon">${BIG_ICONS[big]||'📁'}</span><span style="flex:1;text-align:left">${escH(big)}</span><span class="arrow">›</span>`;
    btn.onclick=()=>toggleBig(big,div,btn);
    div.appendChild(btn);

    const mids=document.createElement('div');
    mids.className='mid-cats';
    (midOrder[big]||[]).forEach(mid=>{
      if(!data[big][mid])return;
      const mb=document.createElement('button');
      mb.className='mid-cat-btn'+(big===currentBig&&mid===currentMid?' active':'');
      mb.innerHTML=`<span style="flex:1;text-align:left">${escH(mid)}</span><span class="count">${data[big][mid].length}</span>`;
      mb.onclick=()=>selectCat(big,mid);
      mids.appendChild(mb);
    });
    div.appendChild(mids);
    list.appendChild(div);
  });
}

function toggleBig(big,div,btn){
  const isOpen=div.classList.contains('open');
  // 全閉じ
  document.querySelectorAll('.big-cat').forEach(d=>d.classList.remove('open'));
  document.querySelectorAll('.big-cat-btn').forEach(b=>b.classList.remove('open'));
  if(!isOpen){
    div.classList.add('open');
    btn.classList.add('open');
    currentBig=big;
  }
}

function selectCat(big,mid){
  currentBig=big; currentMid=mid;
  renderSidebar();
  document.getElementById('catActions').style.display='flex';
  renderGrid(data[big][mid],mid);
  if(window.innerWidth<=700)mobSwitch('prompt');
}

// ══════════════════════════════════════
//  ① GRID：全件表示（スクロール）
// ══════════════════════════════════════
function renderGrid(items,title){
  document.getElementById('catTitle').textContent=title||'検索結果';
  document.getElementById('catSub').textContent=`${items.length} プロンプト`;
  // ① スクロール位置をリセット
  document.getElementById('promptList').scrollTop=0;
  const grid=document.getElementById('grid');
  grid.innerHTML='';

  if(!items.length){
    grid.innerHTML='<div class="empty-msg">プロンプトがありません<br><small>「＋ 追加」ボタンで追加できます</small></div>';
    return;
  }

  // ① 全件DOMを生成（表示制限なし）
  items.forEach((item,idx)=>{
    const inB=builderItems.some(b=>b.en===item.en);
    const card=document.createElement('div');
    card.className='prompt-card'+(inB?' in-builder':'');
    card.dataset.en=item.en;
    card.innerHTML=`
      <div class="card-actions">
        <button class="card-btn add-btn">${inB?'✓済':'＋追加'}</button>
        <button class="card-btn copy-btn">コピー</button>
        <button class="card-btn edit-btn">✏</button>
        <button class="card-btn del-btn">🗑</button>
      </div>
      <div class="prompt-ja">${escH(item.ja||'—')}</div>
      <div class="prompt-en">${escH(item.en)}</div>`;
    card.querySelector('.add-btn').onclick=e=>{e.stopPropagation();addToBuilder(item,card);};
    card.querySelector('.copy-btn').onclick=e=>{e.stopPropagation();copyPrompt(item.en,card);};
    card.querySelector('.edit-btn').onclick=e=>{e.stopPropagation();openEditPrompt(idx,item);};
    card.querySelector('.del-btn').onclick=e=>{e.stopPropagation();deletePrompt(idx);};
    card.onclick=()=>copyPrompt(item.en,card);
    grid.appendChild(card);
  });
}

// ══════════════════════════════════════
//  COPY
// ══════════════════════════════════════
function copyPrompt(text,card){
  writeClip(text);
  copyCount++;
  document.getElementById('copyCount').textContent=copyCount;
  card.classList.add('flash');
  setTimeout(()=>card.classList.remove('flash'),700);
  showToast('📋 '+text);
}

// ══════════════════════════════════════
//  BUILDER
// ══════════════════════════════════════
function addToBuilder(item,card){
  const idx=builderItems.findIndex(b=>!b._sep&&b.en===item.en);
  if(idx!==-1){
    builderItems.splice(idx,1);
    card.classList.remove('in-builder');
    const b=card.querySelector('.add-btn');if(b)b.textContent='＋追加';
    showToast('✕ 削除: '+item.en);
  }else{
    builderItems.push(item);
    card.classList.add('in-builder');
    const b=card.querySelector('.add-btn');if(b)b.textContent='✓済';
    showToast('＋ 追加: '+item.en);
  }
  renderBuilder();
}
function removeFromBuilder(idx){
  const rem=builderItems.splice(idx,1)[0];
  if(!rem._sep){
    const card=document.getElementById('grid').querySelector(`.prompt-card[data-en="${CSS.escape(rem.en)}"]`);
    if(card){card.classList.remove('in-builder');const b=card.querySelector('.add-btn');if(b)b.textContent='＋追加';}
  }
  renderBuilder();
}
function insertSeparator(){
  // 末尾がすでにセパレーターなら挿入しない
  if(builderItems.length>0&&builderItems[builderItems.length-1]._sep)return;
  builderItems.push({_sep:true});
  renderBuilder();
  showToast('↵ 改行を挿入しました');
}
function renderBuilder(){
  // プロンプト件数（セパレーター除く）
  const realItems=builderItems.filter(i=>!i._sep);
  document.getElementById('builderCount').textContent=realItems.length;
  const out=document.getElementById('builderOut');
  const tags=document.getElementById('builderTags');
  const sepBtn=document.getElementById('insertSepBtn');

  if(!builderItems.length){
    out.textContent='「＋追加」で積み上げていく...';out.classList.add('empty');
    tags.innerHTML='<div class="builder-empty">「＋追加」でプロンプトが<br>ここに積み上がります<br><br>「↵ 改行を挿入」でグループ分け可能</div>';
    if(sepBtn)sepBtn.style.display='none';
    return;
  }
  if(sepBtn)sepBtn.style.display='flex';

  // プレビュー：セパレーターで改行して表示
  let previewHTML='';
  let group=[];
  builderItems.forEach((item,i)=>{
    if(item._sep){
      if(group.length){
        previewHTML+=`<span class="builder-out-group">${escH(group.join(', '))}</span><span class="builder-out-group-sep"></span>`;
        group=[];
      }
    }else{
      group.push(item.en.replace(/,\s*$/,'').trim());
    }
  });
  if(group.length)previewHTML+=`<span class="builder-out-group">${escH(group.join(', '))}</span>`;
  out.innerHTML=previewHTML;
  out.classList.remove('empty');

  // タグリスト
  tags.innerHTML='';
  let num=0;
  builderItems.forEach((item,i)=>{
    if(item._sep){
      const sep=document.createElement('div');sep.className='builder-sep';
      sep.innerHTML=`<div class="builder-sep-line"></div><span class="builder-sep-label">↵ 改行</span><div class="builder-sep-line"></div><button class="builder-sep-rm" title="改行を削除">✕</button>`;
      sep.querySelector('.builder-sep-rm').onclick=()=>removeFromBuilder(i);
      tags.appendChild(sep);
    }else{
      num++;
      const tag=document.createElement('div');tag.className='builder-tag';
      tag.innerHTML=`<div class="builder-tag-num">${num}.</div><div class="builder-tag-text"><div class="builder-tag-ja">${escH(item.ja||'—')}</div><div class="builder-tag-en">${escH(item.en)}</div></div><button class="tag-rm" title="削除">✕</button>`;
      tag.querySelector('.tag-rm').onclick=()=>removeFromBuilder(i);
      tags.appendChild(tag);
    }
  });
}
function copyAll(){
  const realItems=builderItems.filter(i=>!i._sep);
  if(!realItems.length){showToast('⚠ プロンプトがありません');return;}
  // コピー時はセパレーター無視でカンマ区切り1行
  const combined=realItems.map(i=>i.en.replace(/,\s*$/,'').trim()).join(', ');
  writeClip(combined);copyCount++;document.getElementById('copyCount').textContent=copyCount;
  showToast(`📋 ${realItems.length}件コピーしました`);
}
function clearAll(){
  builderItems=[];
  document.querySelectorAll('.prompt-card.in-builder').forEach(c=>{c.classList.remove('in-builder');const b=c.querySelector('.add-btn');if(b)b.textContent='＋追加';});
  renderBuilder();showToast('🗑 クリアしました');
}

function openRenameCat(){
  if(!currentBig||!currentMid)return;
  const oldMid=currentMid;
  showModal({title:'✏ 中カテゴリ名を変更',body:`
    <div class="form-group"><label class="form-label">新しい中カテゴリ名 *</label><input class="form-input" id="f_mid" value="${escH(oldMid)}" autocomplete="off"></div>
  `,confirmLabel:'変更する',confirmClass:'primary',onConfirm:()=>{
    const newMid=document.getElementById('f_mid').value.trim();
    if(!newMid){alert('名前は必須です');return false;}
    if(newMid===oldMid)return;
    if(data[currentBig][newMid]!==undefined){alert('同じ名前が既にあります');return false;}
    const newData={};Object.keys(data[currentBig]).forEach(k=>{newData[k===oldMid?newMid:k]=data[currentBig][k];});
    data[currentBig]=newData;
    midOrder[currentBig]=midOrder[currentBig].map(k=>k===oldMid?newMid:k);
    currentMid=newMid;saveLocal();renderSidebar();renderGrid(data[currentBig][currentMid],currentMid);
    showToast(`✅ 「${newMid}」に変更しました`);
  }});
  setTimeout(()=>{const e=document.getElementById('f_mid');e.focus();e.select();},50);
}

function deleteCat(){
  if(!currentBig||!currentMid)return;
  if(!confirm(`「${currentBig} > ${currentMid}」を削除しますか？`))return;
  delete data[currentBig][currentMid];
  midOrder[currentBig]=midOrder[currentBig].filter(m=>m!==currentMid);
  if(Object.keys(data[currentBig]).length===0){delete data[currentBig];bigOrder=bigOrder.filter(b=>b!==currentBig);delete midOrder[currentBig];}
  currentMid=null;saveLocal();renderSidebar();
  document.getElementById('catTitle').textContent='カテゴリを選択';
  document.getElementById('catSub').textContent='';
  document.getElementById('catActions').style.display='none';
  document.getElementById('grid').innerHTML='';
  showToast('🗑 削除しました');
}

document.getElementById('searchInput').addEventListener('input',e=>{

// ══════════════════════════════════════
function showModal({title,body,confirmLabel='OK',confirmClass='',onConfirm,wide=false}){
  closeModal();
  const ov=document.createElement('div');ov.className='modal-overlay';ov.id='activeModal';
  ov.innerHTML=`<div class="modal${wide?' wide':''}">
    <div class="modal-head"><h3>${escH(title)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"><button class="sm-btn" onclick="closeModal()">キャンセル</button><button class="sm-btn ${confirmClass}" id="mConfirm">${escH(confirmLabel)}</button></div>
  </div>`;
  ov.onclick=e=>{if(e.target===ov)closeModal();};
  document.body.appendChild(ov);
  document.getElementById('mConfirm').onclick=()=>{if(onConfirm()!==false)closeModal();};
  ov.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA')document.getElementById('mConfirm').click();if(e.key==='Escape')closeModal();});
}
function closeModal(){const e=document.getElementById('activeModal');if(e)e.remove();}

// ══════════════════════════════════════
//  UTIL
// ══════════════════════════════════════
function writeClip(text){navigator.clipboard.writeText(text).catch(()=>{const e=document.createElement('textarea');e.value=text;document.body.appendChild(e);e.select();document.execCommand('copy');document.body.removeChild(e);});}
function showToast(msg){clearTimeout(toastTimer);const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
loadLocal();

// データが空ならGitHubから取得
if(Object.keys(data).length===0&&syncUrl){
  fetchFromGitHub();
} else if(syncUrl){
  setSyncStatus('loading','同期中...');
  fetchFromGitHub();
} else {
  setSyncStatus('','未設定');
}

renderSidebar();

// 最初の大カテゴリを開いて最初の中カテゴリを選択
if(bigOrder.length>0){
  const firstBig=bigOrder[0];
  if(data[firstBig]&&midOrder[firstBig]&&midOrder[firstBig].length>0){
    const firstMid=midOrder[firstBig][0];
    currentBig=firstBig; currentMid=firstMid;
    renderSidebar();
    document.getElementById('catActions').style.display='flex';
    renderGrid(data[firstBig][firstMid],firstMid);
  }
}
initMobile();

// PWA
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
